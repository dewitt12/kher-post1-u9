spring.application.name=seguridad-web

# Base de datos en memoria (H2) solo para el laboratorio
spring.datasource.url=jdbc:h2:mem:segweb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Contrasenas de los usuarios semilla (se pueden sobrescribir con variables de entorno)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin#2026}
app.seed.user-password=${SEED_USER_PASSWORD:User#2026}

# Endpoints deliberadamente vulnerables SOLO para las capturas del laboratorio.
# Mantener en false; activar con DEMO_VULNERABLE=true unicamente para la prueba temporal.
app.demo.vulnerable=${DEMO_VULNERABLE:false}
