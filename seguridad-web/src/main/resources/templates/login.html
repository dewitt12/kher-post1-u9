<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <div class="card">
        <h1>Iniciar sesión</h1>
        <p class="error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
        <p class="info" th:if="${param.logout}">Sesión cerrada correctamente.</p>

        <!-- th:action hace que Thymeleaf agregue automaticamente el token CSRF oculto -->
        <form th:action="@{/login}" method="post">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit">Entrar</button>
        </form>
    </div>
</main>
</body>
</html>
