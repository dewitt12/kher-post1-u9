<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
    <div class="card">
        <h1>Dashboard</h1>
        <!-- th:text escapa el HTML: cualquier dato del usuario se muestra como texto, no se interpreta -->
        <p>Hola, <strong th:text="${username}">usuario</strong></p>
        <p>Roles:
            <span class="badge" th:each="rol : ${roles}" th:text="${rol}">ROLE_USER</span>
        </p>
    </div>

    <div class="card" sec:authorize="hasRole('ADMIN')">
        <h2>Vista de administrador</h2>
        <p>Puedes gestionar usuarios desde el <a th:href="@{/admin/panel}">panel de administración</a>.</p>
    </div>

    <div class="card" sec:authorize="hasRole('USER')">
        <h2>Vista de usuario</h2>
        <p>Puedes participar en los <a th:href="@{/comentarios}">comentarios</a>. El panel de administración no está disponible para tu rol.</p>
    </div>
</main>
</body>
</html>
